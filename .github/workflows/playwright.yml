name: BTCPay Plugin Tests (Unit Tests)

on:
    push:
        branches: [ "master" ]
    pull_request:
        branches: [ "master" ]

jobs:
    test:
        runs-on: ubuntu-22.04
        
        steps:
            -   uses: actions/checkout@v4
                with:
                    submodules: recursive

            -   name: Initialize and update submodules
                run: git submodule update --init --recursive

            -   name: Setup .NET
                uses: actions/setup-dotnet@v4
                with:
                    dotnet-version: 8.0.414

            -   name: Build solution
                run: |
                    dotnet build BTCPayServer.Plugins.Stash.sln -maxcpucount:1 -p:StaticWebAssetsEnabled=false

            -   name: Run unit tests
                run: dotnet test BTCPayServer.Plugins.Stash.Tests --verbosity normal
