name: Publish Plugin

on:
  push:
    branches: [ main, restoration ] # I added restoration here so it runs for you
  pull_request:
    branches: [ main ]
  workflow_dispatch: # This enables the "Run Workflow" button in UI manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Pack
        run: dotnet pack -c Release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcpayserver-plugin-stash
          path: Plugins/BTCPayServer.Plugins.Stash/bin/Release/*.nupkg